name: Build doma_launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name doma_launcher app.py

      - name: Build installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.5
        with:
          path: installer/doma_launcher.iss
          options: /O+ /DMyAppVersion=1.0.0

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: doma_launcher-portable
          path: dist/doma_launcher.exe

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: doma_launcher-installer
          path: installer/Output/doma_launcher_setup.exe
