name: Build doma_launcher

'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --collect-all minecraft_launcher_lib --name doma_launcher app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: doma-launcher
          path: dist/doma_launcher.exe
